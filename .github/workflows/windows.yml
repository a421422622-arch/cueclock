name: windows

# 在真实的 Windows 机器上：安装依赖 → 引擎与界面测试 → 类型检查 → 构建 → 打包 Windows 版 →
# 用打包出来的 CueClock.exe 跑一次「启动引擎并连接」冒烟 → 上传 zip。
# 手动触发：GitHub → Actions → windows → Run workflow。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'app/**'
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            app/package-lock.json

      - name: 引擎：安装、类型检查、测试
        working-directory: engine
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: 界面：安装、类型检查、测试
        working-directory: app
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: 打包 Windows 版
        working-directory: app
        shell: bash
        run: node ../windows/build-windows.mjs

      - name: 打包产物自检（真实 Windows：CueClock.exe 启动引擎并连接）
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'windows/dist/pkg/CueClock-win32-x64/CueClock.exe'
          if (-not (Test-Path $exe)) { throw '没有 CueClock.exe' }
          $state = Join-Path $env:RUNNER_TEMP 'cc-smoke-state'
          New-Item -ItemType Directory -Force $state | Out-Null
          $project = Join-Path $state 'project.json'
          '{"name":"CI 冒烟","devices":[],"groups":[],"timelines":[],"triggers":[],"settings":{"recovery":{"enabled":false}}}' | Set-Content -Encoding utf8 $project
          $out = Join-Path $state 'smoke.out.txt'; $err = Join-Path $state 'smoke.err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoke-test','--daemon-port','47955','--state-dir',$state,'--project',$project) -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "退出码: $($p.ExitCode)"
          Write-Host '--- stdout ---'; Get-Content $out -ErrorAction SilentlyContinue
          Write-Host '--- stderr ---'; Get-Content $err -ErrorAction SilentlyContinue
          Write-Host '--- 引擎日志 ---'; Get-Content (Join-Path $state 'daemon.out.log') -ErrorAction SilentlyContinue
          Get-Process -Name CueClock -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($p.ExitCode -ne 0 -or -not ((Get-Content $out -Raw) -match 'SMOKE_OK engine.running=true')) { throw '打包产物自检失败' }

      - name: 完整隔离验收（Electron 界面自检，实验性，不阻断）
        working-directory: app
        shell: bash
        continue-on-error: true
        run: npm run verify:isolated

      - uses: actions/upload-artifact@v4
        with:
          name: CueClock-windows-x64
          path: windows/dist/CueClock-*-win-x64.zip
          retention-days: 30
